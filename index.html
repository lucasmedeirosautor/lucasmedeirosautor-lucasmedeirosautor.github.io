<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Protocolo 5×10 – Vença a Depressão em 7 Dias</title>

  <!-- Mantive o mesmo CSS da sua página -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">

  <style>
    :root{
      --bg:#0B0B0C;
      --card:#121316;
      --muted:#9aa0a6;
      --text:#F5F7FA;
      --gold:#FFD54A;
      --green:#23C55E;
      --green-2:#1BA14D;
      --red:#FF5757;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter, Arial, sans-serif;line-height:1.6}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    /* ------------------ QUIZ STYLES ------------------*/
    #quiz-section{
      max-width:550px;margin:40px auto;padding:24px;
      background:var(--card);
      border-radius:16px;border:1px solid #1d2026;
      box-shadow:var(--shadow);
    }
    #quiz-section h2{
      margin-top:0;font-size:28px;text-align:center;margin-bottom:18px
    }
    #quiz-section label{
      display:block;border:1px solid #2a2d33;
      border-radius:12px;padding:10px 14px;margin:8px 0;
      cursor:pointer;transition:.2s
    }
    #quiz-section label:hover{background:#1a1b1e}
    #quiz-section button{
      margin-top:20px;width:100%;
      padding:12px;border:none;border-radius:12px;
      font-weight:700;cursor:pointer;
      background:var(--green);color:#0B0B0C
    }
    #quiz-section button:hover{background:var(--green-2)}
  </style>
</head>
<body>

<!-- ======================= QUIZ ======================= -->
<section id="quiz-section">
  <h2>Vamos começar com um teste rápido 👇</h2>

  <div id="quiz-step-1">
    <p><strong>1) Com que frequência você se sente sem energia e desanimado(a)?</strong></p>
    <label><input type="radio" name="q1" value="0"> Raramente</label>
    <label><input type="radio" name="q1" value="1"> Às vezes</label>
    <label><input type="radio" name="q1" value="2"> Frequentemente</label>
    <button onclick="nextStep(1)">Próxima</button>
  </div>

  <div id="quiz-step-2" style="display:none">
    <p><strong>2) Você já passou com psicólogo ou psiquiatra?</strong></p>
    <label><input type="radio" name="q2" value="0"> Nunca fiz</label>
    <label><input type="radio" name="q2" value="1"> Já fiz uma época</label>
    <label><input type="radio" name="q2" value="2"> Ainda faço atualmente</label>
    <button onclick="nextStep(2)">Próxima</button>
  </div>

  <div id="quiz-step-3" style="display:none">
    <p><strong>3) Atualmente você está fazendo algum tratamento?</strong></p>
    <label><input type="radio" name="q3" value="0"> Não estou tratando</label>
    <label><input type="radio" name="q3" value="1"> Só remédio</label>
    <label><input type="radio" name="q3" value="2"> Remédio + hábitos saudáveis</label>
    <button onclick="verResultado()">Ver Resultado</button>
  </div>

  <div id="quiz-result" style="display:none">
    <p id="quiz-texto-resultado" style="margin-bottom:18px"></p>
    <button onclick="mostrarConteudoPrincipal()">Continuar</button>
  </div>
</section>

<!--================== CONTEÚDO PRINCIPAL ==================-->
<div id="conteudo-principal" style="display:none">
  <!-- AQUI COMEÇA TODO O SEU CÓDIGO ORIGINAL DA PÁGINA -->
  
  <!-- Barra fixa CTA (mobile) -->
  <div class="sticky-cta" id="bar">
    <span class="label">Protocolo 5×10</span>
    <a class="btn btn-primary" href="https://go.hotmart.com/T100961079V?dp=1" target="_blank" rel="noopener">Começar agora</a>
  </div>

  <!-- (o restante do seu HTML permanece idêntico até o final do footer) -->
  <!-- ... -->
  <!-- (eu mantive tudo igual, mas coloque tudo daqui até fechar o body) -->

  <!-- SÓ UM EXEMPLO DO FECHAMENTO -->
  </footer>
</div> <!-- fim do #conteudo-principal -->

<script>
  // Funções JS do Quiz
  function nextStep(step){
    if(step === 1){
      document.getElementById('quiz-step-1').style.display = 'none';
      document.getElementById('quiz-step-2').style.display = 'block';
    }
    if(step === 2){
      document.getElementById('quiz-step-2').style.display = 'none';
      document.getElementById('quiz-step-3').style.display = 'block';
    }
  }

  function verResultado(){
    const v1 = +document.querySelector('input[name="q1"]:checked')?.value || 0;
    const v2 = +document.querySelector('input[name="q2"]:checked')?.value || 0;
    const v3 = +document.querySelector('input[name="q3"]:checked')?.value || 0;
    const total = v1 + v2 + v3;
    let texto = "";

    if(total >= 4){
      texto = "Você demonstra sinais claros de exaustão emocional, mas o fato de estar aqui já mostra que está buscando uma forma real de melhorar. Eu também passei por isso, e foi daí que nasceu o Método 5×10.";
    } else {
      texto = "Você pode estar em um momento de cansaço mental ou emocional. Com algumas ações simples e consistentes, é possível mudar completamente a forma como você se sente nos próximos dias.";
    }

    document.getElementById('quiz-texto-resultado').innerText = texto;
    document.getElementById('quiz-step-3').style.display = 'none';
    document.getElementById('quiz-result').style.display = 'block';
  }

  function mostrarConteudoPrincipal(){
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('conteudo-principal').style.display = 'block';
  }
</script>

</body>
</html>
